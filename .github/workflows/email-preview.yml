name: Send email layout preview

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "All four sources daily summary or single-site layout preview"
        required: true
        type: choice
        options:
          - all
          - xxsj
        default: all

permissions:
  contents: read

concurrency:
  group: paper-auto-send-history
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -v
      - name: Install Chromium for four-source scan
        if: ${{ inputs.scope == 'all' }}
        run: python -m playwright install --with-deps chromium
      - name: Send one preview using real qualifying resources without changing history
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_PWD: ${{ secrets.EMAIL_SMTP_PWD }}
          SCAN_SCOPE: ${{ inputs.scope }}
        shell: python
        run: |
          import logging
          import os
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"])
          from paper_auto_send.mailer import MailDeliveryError, send_email
          from paper_auto_send.runner import newly_found
          from paper_auto_send.sources import crawl_all

          logging.basicConfig(level=logging.INFO, format="%(levelname)s %(message)s")
          today = datetime.now(ZoneInfo("Asia/Shanghai")).date()
          scope = os.environ["SCAN_SCOPE"]
          result = crawl_all(today, scope)
          if scope != "all" and (result.failures or result.successful_sources != 1):
              sys.exit("Preview scan failed; no email sent.")
          papers = newly_found(result, set(), today)
          if not papers:
              sys.exit("No qualifying resources for preview; no email sent.")
          statuses = None
          if scope == "all":
              statuses = {
                  name: (
                      f"扫描未完成／失败，已获得 {count} 份合格资源"
                      if name in result.failures else f"扫描完成，{count} 份合格资源"
                  )
                  for name, count in result.source_counts.items()
              }
          try:
              send_email(papers, test_email=True, source_status=statuses)
          except MailDeliveryError as exc:
              sys.exit(str(exc))
          print(f"SMTP accepted one layout test email containing {len(papers)} resources. History unchanged.")
          if result.failures:
              sys.exit("Summary sent successfully, but some source scans failed; see source status in email.")
